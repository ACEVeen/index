<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owned By ACE Veen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --fg: #e6e6e6;
    --dim: #888;
    --accent: #e63946;
    --accent-dim: #7a1f26;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4rem 1.5rem;
    text-align: center;
    gap: 2.5rem;
  }

  .banner {
    width: min(280px, 60vw);
    filter: grayscale(100%) contrast(1.1);
    opacity: 0.85;
  }

  .owned {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(1.5rem, 5vw, 3rem);
    font-weight: 700;
    letter-spacing: 0.05em;
    line-height: 1.2;
  }

  .owned .accent { color: var(--accent); }

  .greetz {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    color: var(--dim);
    line-height: 1.8;
  }

  .greetz .site { color: var(--accent); }

  /* === MESAJ BLOĞU === */
  .message {
    max-width: 640px;
    font-size: 1.05rem;
    line-height: 1.8;
    color: var(--fg);
    border-left: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
    padding: 1.5rem 2rem;
  }

  .message em {
    color: var(--accent);
    font-style: normal;
    font-weight: 700;
  }

  .player {
    width: 220px;
    height: 32px;
    filter: grayscale(100%) invert(1);
    opacity: 0.7;
  }

  .divider {
    width: 60px;
    height: 2px;
    background: var(--accent-dim);
  }
</style>
</head>
<body>

  <img class="banner" src="https://i.pinimg.com/originals/2f/94/08/2f94086d9d8d7616090e8dabb8e17ff7.gif" alt="">

  <h1 class="owned">
    Owned By <span class="accent">ACE Veen</span> ~ BigYahu
  </h1>

  <div class="greetz">
    Greetz: MecTruy ~ Revonzy ~ Piratica ~ Hegemon<br>
    <span class="site">www.spyhackerz.org</span>
  </div>

  <div class="divider"></div>
  <p class="message">
    Mal cimride, silah korkakta, fikir zayıfta olursa işler bozulur.<br><br>
    Hiçbir sisteme zarar verilmemiştir. <em>Bu sadece bir uyarıdır.</em>
  </p>

  <div class="divider"></div>

  <audio controls class="player">
    <source src="http://a.top4top.io/m_3785xxx0l1.mp3" type="audio/mpeg">
  </audio>

</body>
</html>
